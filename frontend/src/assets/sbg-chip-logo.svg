<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer glow -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
  </defs>

  <!-- Circuit traces - Top -->
  <line x1="70" y1="55" x2="70" y2="20" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="85" y1="55" x2="85" y2="10" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="100" y1="55" x2="100" y2="18" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="115" y1="55" x2="115" y2="10" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="130" y1="55" x2="130" y2="20" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Circuit traces - Bottom -->
  <line x1="70" y1="145" x2="70" y2="180" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="85" y1="145" x2="85" y2="190" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="100" y1="145" x2="100" y2="182" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="115" y1="145" x2="115" y2="190" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="130" y1="145" x2="130" y2="180" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Circuit traces - Left -->
  <line x1="55" y1="70" x2="20" y2="70" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="55" y1="85" x2="10" y2="85" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="55" y1="100" x2="18" y2="100" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="55" y1="115" x2="10" y2="115" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="55" y1="130" x2="20" y2="130" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Circuit traces - Right -->
  <line x1="145" y1="70" x2="180" y2="70" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="145" y1="85" x2="190" y2="85" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="145" y1="100" x2="182" y2="100" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="145" y1="115" x2="190" y2="115" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="145" y1="130" x2="180" y2="130" stroke="#ff9900" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Pin dots -->
  <circle cx="70" cy="20" r="3.5" fill="#ff9900" opacity="0.9"/>
  <circle cx="85" cy="10" r="3.5" fill="#ff9900" opacity="0.7"/>
  <circle cx="100" cy="18" r="3.5" fill="#ff9900"/>
  <circle cx="115" cy="10" r="3.5" fill="#ff9900" opacity="0.7"/>
  <circle cx="130" cy="20" r="3.5" fill="#ff9900" opacity="0.9"/>
  <circle cx="70" cy="180" r="3.5" fill="#ff9900" opacity="0.9"/>
  <circle cx="85" cy="190" r="3.5" fill="#ff9900" opacity="0.7"/>
  <circle cx="100" cy="182" r="3.5" fill="#ff9900"/>
  <circle cx="115" cy="190" r="3.5" fill="#ff9900" opacity="0.7"/>
  <circle cx="130" cy="180" r="3.5" fill="#ff9900" opacity="0.9"/>
  <circle cx="20" cy="70" r="3.5" fill="#ff9900" opacity="0.9"/>
  <circle cx="10" cy="85" r="3.5" fill="#ff9900" opacity="0.7"/>
  <circle cx="18" cy="100" r="3.5" fill="#ff9900"/>
  <circle cx="10" cy="115" r="3.5" fill="#ff9900" opacity="0.7"/>
  <circle cx="20" cy="130" r="3.5" fill="#ff9900" opacity="0.9"/>
  <circle cx="180" cy="70" r="3.5" fill="#ff9900" opacity="0.9"/>
  <circle cx="190" cy="85" r="3.5" fill="#ff9900" opacity="0.7"/>
  <circle cx="182" cy="100" r="3.5" fill="#ff9900"/>
  <circle cx="190" cy="115" r="3.5" fill="#ff9900" opacity="0.7"/>
  <circle cx="180" cy="130" r="3.5" fill="#ff9900" opacity="0.9"/>

  <!-- Chip body with glow -->
  <rect x="55" y="55" width="90" height="90" rx="10" ry="10" fill="url(#chipGrad)" filter="url(#glow)"/>
  <rect x="55" y="55" width="90" height="90" rx="10" ry="10" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner die area -->
  <rect x="68" y="68" width="64" height="64" rx="5" fill="#4c1d95" opacity="0.7"/>
  <rect x="68" y="68" width="64" height="64" rx="5" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>

  <!-- AWS Smile arrow (simplified) -->
  <path d="M 82 108 Q 100 118 118 108" stroke="#ff9900" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="114,104 118,108 112,110" fill="#ff9900"/>

  <!-- "SBG" text on chip -->
  <text x="100" y="99" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#e8edf3" text-anchor="middle" letter-spacing="2">SBG</text>
</svg>
